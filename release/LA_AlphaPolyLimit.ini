; LA_AlphaPolyLimit - Union plugin (Gothic 2 NotR 2.6 fix). Copy next to LA_AlphaPolyLimit.dll into System\Autorun.
; Details: README.md, doc\ANALYSE.md. All switches 0/1 unless noted.
[LA_ALPHAPOLYLIMIT]
; master switch (0 = load, check the code, log one line, patch nothing)
Enabled=1
; alpha world polygons (zCRenderManager::Flush): never wrap the pool (wrap = endless loop in RenderAlphaSortList,
; "D: RNDMAN: too many alphaWorldPolys!"); polygons beyond the pool are skipped for that frame
AlphaPoolFix=1
; pool size for AlphaPoolFix: 4096 (engine size) .. 262144; larger values only cost 20 bytes per slot
AlphaWorldPolys=16384
; MRM/MDM build of -zautoconvertdata: a degenerate polygon that holds one vertex twice no longer frees it twice
; (zCVertex pool corruption, crash in zCMemPoolBase::Alloc)
DegenerateFix=1
; log LA_AlphaPolyLimit.log next to the DLL (load line, pool overflow records, prevented double frees, summary at exit)
Diag=1
DiagMaxLines=200
